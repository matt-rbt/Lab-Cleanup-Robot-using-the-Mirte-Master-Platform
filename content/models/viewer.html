<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #d1d9e6;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #d1d9e6;
    }
  </style>
</head>

<body>
  <model-viewer
    src="./floor_with_cubes.glb"
    alt="Floor with cubes"
    camera-controls
    auto-rotate>
  </model-viewer>
</body>
</html>
