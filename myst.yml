version: 1
project:
  title: Lab Cleanup Robot using Mirte Master Platform
  # description:
  keywords: [Navigation2, ROS2, SLAM, Mobile_Manipulation]
  github: https://github.com/matt-rbt/Lab-Cleanup-Robot-using-the-Mirte-Master-Platform
  date: 2026-04-21
  thumbnail: style/thumbnail.jpg
  numbering:
    title: true
  references:
    myst-guide: https://mystmd.org/guide
    JB-workshop: https://jupyter-book.github.io/workshop-template/
  exclude:
    - errorlog.md
    - README.md
    - content/Cheatsheet.md
  bibliography:
    - references.bib
  jupyter:
    binder:
      repo: https://github.com/matt-rbt/Lab-Cleanup-Robot-using-the-Mirte-Master-Platform

extends:
  - toc.yml
  - export.yml
  - plugins.yml
  - authors.yml

site:
  template: book-theme
  options:
    favicon: style/favicon.ico
    logo: style/tudelft.png
    logo_dark: style/tudelft-dark.png
    hide_authors: false
    style: style/custom.css
  html:
    sanitize: false
    head: |
      <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
      <style>
        .cover-image { position: relative; overflow: hidden; }
        .cover-image img { display: none; }
        .cover-video {
          position: absolute; top: 50%; left: 50%;
          transform: translate(-50%, -50%);
          min-width: 100%; min-height: 100%;
          object-fit: cover; z-index: 0;
        }
      </style>
      <script>
        document.addEventListener('DOMContentLoaded', () => {
          const cover = document.querySelector('.cover-image');
          if (cover) {
            const v = document.createElement('video');
            v.src = '_static/hero.mp4';
            v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true;
            v.className = 'cover-video';
            cover.prepend(v);
          }
        });
      </script>
  actions:
    - title: PDF
      url: ./exports/report_tex.pdf
    - title: Typst PDF
      url: ./exports/report_typst.pdf
  parts:
    footer: style/footer.md